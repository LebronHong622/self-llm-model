# config/test.yaml - 测试环境配置
model:
  context_length: 1024       # 与 GPT-2 一致，支持预训练权重加载

training:
  batch_size: 8
  num_epochs: 1
  device: "cpu"
  save_interval: 10
  log_interval: 5

logging:
  level: "DEBUG"

data:
  max_seq_length: 256

eval:
  device: "cuda"              # 当前环境无 CUDA
  max_new_tokens: 50
  temperature: 0.5
  top_k: 25
